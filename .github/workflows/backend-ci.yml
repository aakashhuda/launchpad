name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, types, migrations, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: launchpad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: development
      SECRET_KEY: ci-secret-key
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/launchpad
      REDIS_URL: redis://localhost:6379/0
      EMAIL_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"
          cache: pip
          cache-dependency-path:
            - backend/requirements/base.txt
            - backend/requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Import order check (isort)
        run: isort --check-only .

      - name: Type check (mypy)
        run: mypy src

      - name: Apply migrations
        run: alembic upgrade head

      - name: Migration drift check (alembic check)
        run: alembic check

      - name: Export OpenAPI schema
        run: python scripts/export_openapi.py --output /tmp/openapi.json

      - name: API compatibility check
        run: python scripts/openapi_compat.py openapi.json /tmp/openapi.json

      - name: Tests (unit + integration)
        run: pytest -q --cov=src --cov-report=term-missing
