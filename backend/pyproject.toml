[project]
name = "launchpad-backend"
version = "0.1.0"
description = "Launchpad backend service"
requires-python = "==3.10.12"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
files = ["src"]
# Keep the gate meaningful but pragmatic: untyped third-party modules are
# handled per-module below rather than globally.
ignore_missing_imports = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

